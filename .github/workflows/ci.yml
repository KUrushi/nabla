name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NABLA_LISP_DEPS: ${{ github.workspace }}/.nabla-lisp-deps
  NABLA_IREE_HOME: ${{ github.workspace }}/.nabla-iree-home
  NABLA_IREE_SRC: ${{ github.workspace }}/../iree-src
  NABLA_IREE_BUILD: ${{ github.workspace }}/../iree-build-runtime
  NABLA_IREE_WHEEL_DIR: ${{ github.workspace }}/../iree-wheel
  NABLA_PJRT_HOME: ${{ github.workspace }}/.nabla-pjrt-home
  NABLA_PJRT_WHEEL_DIR: ${{ github.workspace }}/../pjrt-wheel

jobs:
  # IREE と PJRT をキャッシュに用意するだけのジョブ。キャッシュが当たれば
  # lookup-only で中身を落とさずに終わる（数秒）。test の各シャードが
  # 同時にキャッシュを外して IREE を何度もビルドしないように、ここで1回だけ作る。
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Look up IREE cache
        id: cache-iree
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.NABLA_IREE_HOME }}
          key: iree-${{ runner.os }}-${{ hashFiles('third_party/iree.lock', 'scripts/build-iree.sh') }}
          lookup-only: true

      - name: Look up PJRT cache
        id: cache-pjrt
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.NABLA_PJRT_HOME }}
          key: pjrt-${{ runner.os }}-${{ hashFiles('third_party/pjrt.lock', 'scripts/fetch-pjrt.sh') }}
          lookup-only: true

      - name: Install IREE build toolchain
        if: steps.cache-iree.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build python3-pip

      - name: Build IREE (compiler wheel + runtime from source)
        if: steps.cache-iree.outputs.cache-hit != 'true'
        run: |
          SECONDS=0
          scripts/build-iree.sh --compiler=wheel
          echo "IREE build took ${SECONDS}s (cold, no cache)."

      - name: Verify IREE (CPU only)
        if: steps.cache-iree.outputs.cache-hit != 'true'
        run: scripts/verify-iree.sh

      - name: Save IREE cache
        if: steps.cache-iree.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.NABLA_IREE_HOME }}
          key: ${{ steps.cache-iree.outputs.cache-primary-key }}

      - name: Fetch PJRT CPU plugin
        if: steps.cache-pjrt.outputs.cache-hit != 'true'
        run: scripts/fetch-pjrt.sh

      - name: Save PJRT cache
        if: steps.cache-pjrt.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.NABLA_PJRT_HOME }}
          key: ${{ steps.cache-pjrt.outputs.cache-primary-key }}

  # 既定のスイート（small + medium）を NABLA_TEST_SHARD で SHARDS 個に分けて
  # 並列に走らせる。シャードの数を変えるときは matrix と NABLA_TEST_SHARD の
  # 分母を一緒に変える。
  test:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      NABLA_REQUIRE_IREE: "1"
      NABLA_REQUIRE_PJRT: "1"
      NABLA_TEST_SHARD: ${{ matrix.shard }}/8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache Lisp dependencies (check-it / optima git clones)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.NABLA_LISP_DEPS }}
          key: lisp-deps-${{ runner.os }}-${{ hashFiles('scripts/setup-lisp-deps.sh') }}

      # 依存（ironclad だけで約40秒）のコンパイル結果。ASDF はソースより新しい
      # fasl だけを使うので、apt のソース（日付が固定）の fasl は当たり、
      # checkout したばかりの nabla 自身の fasl は古いとみなされて作り直される。
      # どのシャードも同じ中身を作るので、保存はシャード 1 だけがする。
      - name: Restore Lisp fasl cache
        id: cache-fasl
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/common-lisp
          key: lisp-fasl-${{ runner.os }}-${{ hashFiles('scripts/setup-lisp-deps.sh') }}

      - name: Install SBCL and Lisp dependencies
        run: |
          # apt の man-db のトリガー（索引の作り直し）は数秒かかり、CI では要らない
          sudo rm -f /var/lib/man-db/auto-update
          sudo -E NABLA_LISP_DEPS="${NABLA_LISP_DEPS}" scripts/setup-lisp-deps.sh
          sudo apt-get install -y --no-install-recommends sbcl
          sudo chown -R "$USER" "${NABLA_LISP_DEPS}"

      - name: Restore IREE
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.NABLA_IREE_HOME }}
          key: iree-${{ runner.os }}-${{ hashFiles('third_party/iree.lock', 'scripts/build-iree.sh') }}
          fail-on-cache-miss: true

      - name: Restore PJRT CPU plugin
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.NABLA_PJRT_HOME }}
          key: pjrt-${{ runner.os }}-${{ hashFiles('third_party/pjrt.lock', 'scripts/fetch-pjrt.sh') }}
          fail-on-cache-miss: true

      - name: Run default test suite (small + medium, shard ${{ matrix.shard }}/8)
        run: |
          SECONDS=0
          scripts/run-tests.sh
          echo "run-tests.sh took ${SECONDS}s."

      - name: Run nabla-mutate's own test suite
        if: matrix.shard == 1
        run: |
          CL_SOURCE_REGISTRY="$(pwd)//:${NABLA_LISP_DEPS}//:" \
            sbcl --non-interactive \
              --eval '(require :asdf)' \
              --eval '(asdf:load-system "nabla-mutate/tests")' \
              --eval '(uiop:quit (if (nabla.mutate.tests:run-tests) 0 1))'

      - name: Save Lisp fasl cache
        if: matrix.shard == 1 && steps.cache-fasl.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/common-lisp
          key: ${{ steps.cache-fasl.outputs.cache-primary-key }}
